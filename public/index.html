<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Counseling System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
        }

        .navbar {
            width: 85%;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            color: white;
            background: linear-gradient(to right, #fff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu ul {
            display: flex;
            list-style: none;
        }

        .menu ul li {
            margin-left: 35px;
        }

        .menu ul li a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-weight: 500;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu ul li a:hover {
            color: #38bdf8;
        }

        .content {
            width: 80%;
            margin: auto;
            margin-top: 150px;
            max-width: 800px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content h1 {
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        .content span {
            display: block;
            color: #38bdf8;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .par {
            margin-top: 30px;
            font-size: 20px;
            line-height: 1.6;
            color: #94a3b8;
            max-width: 550px;
        }

        .btn {
            margin-top: 40px;
            padding: 16px 40px;
            border: none;
            background: #38bdf8;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
        }

        .btn:hover {
            background: #0ea5e9;
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>

<body>

    <canvas id="particles"></canvas>

    <div class="navbar">
        <div class="logo">
            CAREER AI
        </div>

        <div class="menu">
            <ul>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </div>

    <div class="content">
        <h1>
            AI Powered <br>
            <span>Career Pathing</span>
        </h1>

        <p class="par">
            Precision-engineered career guidance using Artificial Intelligence. 
            We analyze your profile to illuminate the path to your professional peak.
        </p>

        <a href="login.html" class="btn">Get Started Now</a>
    </div>

    <script>
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.size = 2;
            }

            move() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = "#38bdf8";
                ctx.fill();
            }
        }

        for (let i = 0; i < 120; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.move();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>

</html>
