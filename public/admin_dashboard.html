<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  body {margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(120deg,#1e3c72,#2a5298);color:white; min-height: 100vh;}
  .sidebar {width:220px;height:100vh;position:fixed;background:#0f2027;padding-top:30px;}
  .sidebar h2 {text-align:center;margin-bottom:40px;color:#f39c12;}
  .sidebar a {display:block;color:white;padding:15px;text-decoration:none; cursor: pointer;}
  .sidebar a:hover {background:#2c5364;}
  .main {margin-left:220px;padding:30px;}
  .card {background:white;color:black;padding:20px;border-radius:10px;margin-bottom:25px;box-shadow:0 4px 10px rgba(0,0,0,0.2);}
  table {width: 100%; border-collapse: collapse; margin-top: 15px;}
  th, td {border: 1px solid #ddd; padding: 12px; text-align: left;}
  th {background-color: #1e3c72; color: white;}
  tr:nth-child(even) {background-color: #f2f2f2;}
</style>
</head>
<body>
<div class="sidebar">
  <h2>Admin Portal</h2>
  <a href="admin_dashboard.html">Activity Tracker</a>
  <a id="logout-btn">Secure Logout</a>
</div>
<div class="main">
  <h1>System Tracking Dashboard</h1>
  <div class="card">
    <h2>Recent User Activity</h2>
    <p>Live tracker of signups, logins, and resume generations across the platform.</p>
    
    <table id="logs-table">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>User Email</th>
          <th>Action Logged</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        <tr id="loading-row">
          <td colspan="4" style="text-align:center;">Loading logs...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
    const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

    async function checkAdminAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || session.user.email !== "admin@admin.com") {
            window.location.href = "login.html";
        } else {
            loadLogs();
        }
    }

    async function loadLogs() {
        try {
            const response = await fetch(`${CONFIG.API_BASE_URL}/api/logs`);
            const logs = await response.json();
            
            const tbody = document.querySelector("#logs-table tbody");
            tbody.innerHTML = "";

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No activity logged yet.</td></tr>';
                return;
            }

            logs.forEach(log => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${log.timestamp}</td>
                    <td><b>${log.user}</b></td>
                    <td><span style="color: green;">${log.action}</span></td>
                    <td>${log.details || ""}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error(err);
            document.getElementById("loading-row").innerHTML = '<td colspan="4" style="text-align:center; color: red;">Failed to load logs.</td>';
        }
    }

    document.getElementById("logout-btn").onclick = async () => {
        await supabaseClient.auth.signOut();
        localStorage.clear();
        window.location.href = "login.html";
    };

    checkAdminAuth();
</script>
</body>
</html>
