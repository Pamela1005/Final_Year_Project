services:
  # ──────────────────────────────────────────────
  # Backend – Flask / Gunicorn
  # ──────────────────────────────────────────────
  - type: web
    name: career-counseling-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # ──────────────────────────────────────────────
  # Frontend – Static Site (HTML / JS / CSS)
  # ──────────────────────────────────────────────
  - type: web
    name: career-counseling-frontend
    env: static
    staticPublishPath: ./public
    buildCommand: echo "No build step required"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
